syntax = "proto3";


message ClientRequest {
    string name = 1;
    string email = 2;
    string phone_number = 3;
}

message ClientResponse {
    bytes id = 1;
    string name = 2;
    string email = 3;
    string phone_number = 4;
}

service ClientService {
  rpc CreateClient(ClientRequest) returns (ClientResponse);
  
}

